name: Clipper
options:
  bundleIdPrefix: com.newtonfav
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 7PUR729CY8
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Clipper:
    type: application
    platform: iOS
    sources:
      - path: Clipper
        excludes:
          - AppIcon.icon
          - "*.storekit"
      - path: Clipper/AppIcon.icon
        type: file
        buildPhase: resources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newtonfav.clip
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Clipper/Info.plist
      properties:
        CFBundleDisplayName: Clipper
        CFBundleName: Clipper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Clipper/Clipper.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.newtonfav.clip
    dependencies:
      - target: ClipperKeyboard
        embed: true
      - target: ClipperShare
        embed: true

  ClipperKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - ClipperKeyboard
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newtonfav.clip.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ClipperKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Clipper
        CFBundleName: ClipperKeyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: ClipperKeyboard/ClipperKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.newtonfav.clip

  ClipperShare:
    type: app-extension
    platform: iOS
    sources:
      - ClipperShare
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newtonfav.clip.share
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ClipperShare/Info.plist
      properties:
        CFBundleDisplayName: Clipper
        CFBundleName: ClipperShare
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ClipperShare/ClipperShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.newtonfav.clip

  ClipperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClipperTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newtonfav.clip.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Clipper

schemes:
  Clipper:
    build:
      targets:
        Clipper: all
        ClipperKeyboard: all
        ClipperShare: all
    run:
      config: Debug
      storeKitConfiguration: Clipper/Clipper.storekit
    test:
      config: Debug
      targets:
        - ClipperTests
  ClipperKeyboard:
    build:
      targets:
        ClipperKeyboard: all
    run:
      config: Debug
      askForAppToLaunch: true
      launchAutomaticallySubstyle: 2
